name: Verify Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  php-syntax-check:
    name: Syntax Check and Tests
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        
    - name: Run PHP Syntax Check (Linting)
      run: |
        echo "Checking PHP syntax for all files..."
        find . -type f -name "*.php" -exec php -l {} \; 2>&1 | grep -v "No syntax errors detected" || true
        # If there are any syntax errors, fail the build
        if find . -type f -name "*.php" -exec php -l {} \; 2>&1 | grep -q "Parse error"; then
          echo "Syntax errors found! Please fix them before merging."
          exit 1
        fi
        echo "All PHP files passed syntax check!"

    # Three of the tests restored in this PR require vendor/autoload.php, and
    # vendor/ is not committed. No database or config.php is needed.
    - name: Install Composer dependencies
      run: composer install --no-interaction --prefer-dist --no-progress

    - name: Run Test Suite
      run: |
        echo "Running tests/*.php..."
        status=0
        for f in tests/test_*.php; do
          echo "=== $f ==="
          php "$f" || status=1
        done
        exit $status
