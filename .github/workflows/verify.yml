name: Verify Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  php-syntax-check:
    name: PHP Syntax Check and Tests
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        
    - name: Run PHP Syntax Check (Linting)
      run: |
        echo "Checking PHP syntax for all files..."
        find . -type f -name "*.php" -exec php -l {} \; 2>&1 | grep -v "No syntax errors detected" || true
        # If there are any syntax errors, fail the build
        if find . -type f -name "*.php" -exec php -l {} \; 2>&1 | grep -q "Parse error"; then
          echo "Syntax errors found! Please fix them before merging."
          exit 1
        fi
        echo "All PHP files passed syntax check!"

    # Some tests pull in vendor/autoload.php, and vendor/ is not committed.
    - name: Install Composer dependencies
      run: composer install --no-interaction --prefer-dist --no-progress

    - name: Run test suite
      run: |
        status=0
        for test_file in tests/*.php; do
          echo "----------------------------------------"
          echo "Running ${test_file}"
          echo "----------------------------------------"
          # Each test script exits non-zero when an assertion fails.
          if ! php "${test_file}"; then
            status=1
          fi
        done
        if [ "${status}" -ne 0 ]; then
          echo "One or more test files reported failures."
        fi
        exit "${status}"
