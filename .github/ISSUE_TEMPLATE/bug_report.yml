name: Bug report
description: Report a bug or unexpected behavior in the portal
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description & Steps to Reproduce
      description: What happened, and what did you expect instead? Include simple steps to reproduce if applicable.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. See error / unexpected behavior
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment (Optional)
      description: Browser, OS, or live portal vs local setup.
      placeholder: "Chrome on Windows 11 / Live Portal"

  - type: textarea
    id: additional-info
    attributes:
      label: Screenshots, Logs or Additional Context (Optional)
      description: Drag & drop screenshots, paste error logs, or add extra notes.
